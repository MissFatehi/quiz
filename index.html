<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="./src/style.css" />
    <title>Document</title>
  </head>
  <body class="w-ful h-screen flex flex-col justify-center items-center bg-bg-body font-primary transition-all duration-200">
    <section id="sectionOne" class="w-105  h-110 flex flex-col justify-between items-center border bg-white rounded-[10px] p-6 shadow-[2px_5px_10px_10px_rgba(0,0,0,0.1)]">

        <h1 class="text-xl font-bold">Quiz Configuration</h1>

      <div class="w-full flex flex-col gap-3  font-medium">
        <p class="col-span-2 text-[18px] text-center">Select Category</p>
        <div id="categories" class="w-full grid grid-cols-2 gap-3 text-[15px] font-medium">
          <div id="programming" class="item p-3 text-center border border-cat-border rounded-md hover:bg-cat-bg-hover ">Programming</div>
        <div id="geography" class="item p-3 text-center border border-cat-border rounded-md hover:bg-cat-bg-hover ">Geography</div>
        <div id="mathematics" class="item p-3 text-center border border-cat-border rounded-md hover:bg-cat-bg-hover  ">Mathematics</div>
        <div id="entertainment" class="item p-3 text-center border border-cat-border rounded-md hover:bg-cat-bg-hover ">Entertainment</div>
        </div>
  
      </div>

      <div class=" flex flex-col gap-3">
        <p class="text-[18px] text-center font-medium">No. Of Questions</p>
        <div id="numberList" class="flex justify-center gap-3 text-[15px] font-medium">
          <div id="5" class="num w-13 p-3 text-center border border-cat-border rounded-md hover:bg-cat-bg-hover ">5</div>
          <div id="10" class="num w-13 p-3 text-center border border-cat-border rounded-md hover:bg-cat-bg-hover ">10</div>
          <div id="15" class="num w-13 p-3 text-center border border-cat-border rounded-md hover:bg-cat-bg-hover ">15</div>
          <div id="20" class="num w-13 p-3 text-center border border-cat-border rounded-md hover:bg-cat-bg-hover ">20</div>
          <div id="25" class="num w-13 p-3 text-center border border-cat-border rounded-md hover:bg-cat-bg-hover ">25</div>
        </div>
      </div>

      <button id="startBtn" class="bg-Btn-bg text-white px-6 py-3 border text-[16px] font-medium rounded-lg hover:bg-Btn-bg-hover" >Start Quiz</button>
    </section>

    <section id="sectionTwo" class="w-120 min-h-125  flex-col justify-start items-center border bg-white rounded-[10px] shadow-[2px_5px_10px_10px_rgba(0,0,0,0.1)] hidden">
     
      <div class="w-full flex justify-between shadow-[0px_3px_6px_rgba(0,0,0,0.1)] px-6 py-5">
        <p class="text-2xl font-bold">Quiz Application</p>

        <div class="w-22 flex justify-between items-center gap-1 px-3 py-1 bg-gray-900 text-white rounded-lg">
       <span class="material-symbols-rounded ">timer</span>
        <span id="timer" class="font-medium">15 s</span> 
         </div>
         
      </div>

      <div class="w-full felx flex-col justify-start shadow-[0px_3px_6px_rgba(0,0,0,0.1)] px-6 py-5">
        <p id="question" class="text-2xl font-semibold mb-4">Which of the following is NOT a semantic HTML element?</p>
        <ul id="answers" class="w-full flex flex-col gap-3 text-[16PX] font-normal">
          <li class=" w-full h-12 bg-answer-bg border border-cat-border px-4 py-2 rounded-md hover:bg-cat-bg-hover">heuy</li>
          <li class=" w-full h-12 bg-answer-bg border border-cat-border px-4 py-2 rounded-md hover:bg-cat-bg-hover">fvf</li>
          <li class=" w-full h-12 bg-answer-bg border border-cat-border px-4 py-2 rounded-md hover:bg-cat-bg-hover">fgrdgfd</li>
          <li class=" w-full h-12 bg-answer-bg border border-cat-border px-4 py-2 rounded-md hover:bg-cat-bg-hover">mbhf</li>
        </ul>
      </div>

      <div class="w-full flex justify-between px-6 py-5">
        <p class="text-xl font-normal">1 of 10 question</p>
        <button id="nextBtn" class=" flex justify-center items-center gap-2 px-4 py-2 bg-Btn-bg hover:bg-Btn-bg-hover rounded-md text-white font-medium">Next <i class="fas fa-arrow-right"></i></button>
      </div>
    </section>

    <section id="result" class=" w-120 min-h-125  flex-col justify-start items-center border bg-white rounded-[10px] shadow-[2px_5px_10px_10px_rgba(0,0,0,0.1)] hidden" >

    </section>

    <script type="module" src="./src/questions.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
